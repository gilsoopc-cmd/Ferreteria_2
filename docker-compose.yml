# docker-compose.yml
services:
  php:
    build: .                 # Construye la imagen desde tu Dockerfile
    container_name: ci4-php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html      # Monta tu proyecto en el contenedor
    depends_on:
      - db
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1

  db:
    image: postgres:15
    container_name: ci4-postgres
    environment:
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: Cc_34
      POSTGRES_DB: ferreteria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # Mantiene la base de datos aunque el contenedor se reinicie

# Volumen persistente para PostgreSQL
volumes:
  pgdata:
      